        // STATE MANAGEMENT
        let currentSlideIndex = 0;

        // DOM ELEMENTS
        const slideCard = document.getElementById('slide-card');
        const slideContent = document.getElementById('slide-content');
        const slideFooterTag = document.getElementById('slide-footer-tag');
        const currentSlideNumEl = document.getElementById('current-slide-num');
        const totalSlidesNumEl = document.getElementById('total-slides-num');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const mobilePrev = document.getElementById('mobile-prev');
        const mobileNext = document.getElementById('mobile-next');
        const mobileSelect = document.getElementById('mobile-slide-select');
        const thumbnailsContainer = document.getElementById('thumbnails-container');
        const slideDrawer = document.getElementById('slide-drawer');
        const toggleThumbsBtn = document.getElementById('toggle-thumbs-btn');
        const closeDrawerBtn = document.getElementById('close-drawer-btn');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');

        // INITIALIZATION
        function initApp() {
            totalSlidesNumEl.textContent = slidesData.length;
            renderThumbnails();
            renderMobileSelect();
            renderSlide(0);

            // Setup Theme from user preference or system
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        // RENDER SLIDE FUNCTION
        function renderSlide(index) {
            if (index < 0 || index >= slidesData.length) return;

            currentSlideIndex = index;
            const slide = slidesData[index];

            // Animate transition out
            slideCard.classList.add('fade-enter');

            setTimeout(() => {
                // Insert HTML
                slideContent.innerHTML = `
                    <div class="mb-6 border-b border-slate-100 dark:border-slate-800/80 pb-4">
                        <span class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
                            Slide ${slide.id} of ${slidesData.length}
                        </span>
                        <h2 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight mt-1">
                            ${slide.title}
                        </h2>
                        ${slide.subtitle ? `<p class="text-sm text-slate-500 dark:text-slate-400 font-medium mt-1">${slide.subtitle}</p>` : ''}
                    </div>
                    <div class="flex-1 flex flex-col justify-center">
                        ${slide.content}
                    </div>
                `;

                // Update Header Counter & Footer
                currentSlideNumEl.textContent = index + 1;
                slideFooterTag.textContent = `Slide ${index + 1} of ${slidesData.length}`;

                // Update Progress bar
                const progressPercent = ((index + 1) / slidesData.length) * 100;
                progressBar.style.width = `${progressPercent}%`;

                // Update Button Disabled States
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === slidesData.length - 1;
                mobilePrev.disabled = index === 0;
                mobileNext.disabled = index === slidesData.length - 1;

                // Update Mobile Select
                mobileSelect.value = index;

                // Highlight Active Thumbnail
                updateActiveThumbnail(index);

                // Animate transition in
                slideCard.classList.remove('fade-enter');
                slideCard.classList.add('fade-enter-active');
            }, 150);
        }

        // RENDER SIDEBAR THUMBNAILS
        function renderThumbnails() {
            thumbnailsContainer.innerHTML = '';
            slidesData.forEach((slide, idx) => {
                const item = document.createElement('button');
                item.className = `w-full text-left p-3 rounded-xl border transition-all flex items-start gap-3 text-xs thumbnail-item ${
                    idx === currentSlideIndex 
                    ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 font-semibold' 
                    : 'border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800/60'
                }`;
                item.dataset.index = idx;
                item.innerHTML = `
                    <span class="w-5 h-5 rounded-md bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center text-[10px] font-bold shrink-0">
                        ${slide.id}
                    </span>
                    <div class="truncate">
                        <div class="truncate text-slate-800 dark:text-slate-200 font-medium">${slide.title}</div>
                        <div class="text-[10px] text-slate-400 truncate">${slide.subtitle || ''}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    renderSlide(idx);
                    if (window.innerWidth < 1024) {
                        slideDrawer.classList.add('translate-x-full');
                    }
                });
                thumbnailsContainer.appendChild(item);
            });
        }

        function updateActiveThumbnail(activeIndex) {
            const thumbs = thumbnailsContainer.querySelectorAll('.thumbnail-item');
            thumbs.forEach((thumb, idx) => {
                if (idx === activeIndex) {
                    thumb.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40', 'font-semibold');
                    thumb.classList.remove('border-slate-200', 'dark:border-slate-800');
                    thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    thumb.classList.remove('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40', 'font-semibold');
                    thumb.classList.add('border-slate-200', 'dark:border-slate-800');
                }
            });
        }

        // RENDER MOBILE SELECT OPTIONS
        function renderMobileSelect() {
            mobileSelect.innerHTML = '';
            slidesData.forEach((slide, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${slide.id}. ${slide.title}`;
                mobileSelect.appendChild(opt);
            });
        }

        // NAVIGATION LISTENERS
        prevBtn.addEventListener('click', () => renderSlide(currentSlideIndex - 1));
        nextBtn.addEventListener('click', () => renderSlide(currentSlideIndex + 1));
        mobilePrev.addEventListener('click', () => renderSlide(currentSlideIndex - 1));
        mobileNext.addEventListener('click', () => renderSlide(currentSlideIndex + 1));

        mobileSelect.addEventListener('change', (e) => {
            renderSlide(parseInt(e.target.value, 10));
        });

        // KEYBOARD NAVIGATION
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                renderSlide(currentSlideIndex + 1);
            } else if (e.key === 'ArrowLeft') {
                renderSlide(currentSlideIndex - 1);
            }
        });

        // TOGGLE DRAWER
        toggleThumbsBtn.addEventListener('click', () => {
            slideDrawer.classList.toggle('translate-x-full');
        });
        closeDrawerBtn.addEventListener('click', () => {
            slideDrawer.classList.add('translate-x-full');
        });

        // THEME TOGGLE
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // FULLSCREEN TOGGLE
        fullscreenToggleBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // SWIPE GESTURE SUPPORT FOR TOUCH DEVICES
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                renderSlide(currentSlideIndex + 1); // Swipe Left -> Next
            }
            if (touchEndX > touchStartX + threshold) {
                renderSlide(currentSlideIndex - 1); // Swipe Right -> Prev
            }
        }

        // START APP ON LOAD
        window.onload = initApp;
    </script>
</body>
